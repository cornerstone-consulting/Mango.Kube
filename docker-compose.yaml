#Finalize
secrets:
  nugetconfig:
    file: ${NUGET_CONFIG_PATH}

networks:
  mango-network:
    driver: bridge

volumes:
  mango-sql-data:
  mango-rabbit-data:

services:
  mango-auth:
    build:
      context: ./Mango.Services.AuthAPI
      dockerfile: Dockerfile
      secrets:
        - nugetconfig
    image: ${DOCKER_REGISTRY-}mangoauthapi
    container_name: mango-auth

    env_file:
      - ./Mango.Services.AuthAPI/.env
    ports:
      - "5005:8080"
    networks:
      - mango-network
    depends_on:
      mango-sql-docker:
        condition: service_healthy
      mango-rabbitmq-docker:
        condition: service_healthy

  mango-product:
    build:
      context: ./Mango.Services.ProductAPI
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY-}mangoproductapi
    container_name: mango-product
    env_file:
      - ./Mango.Services.ProductAPI/.env
    ports:
      - "5156:8080"
    networks:
      - mango-network
    depends_on:
      mango-sql-docker:
        condition: service_healthy

  mango-coupon:
    image: ${DOCKER_REGISTRY-}mangocouponapi
    container_name: mango-coupon
    build:
      context: ./Mango.Services.CouponAPI
      dockerfile: Dockerfile
    env_file:
      - ./Mango.Services.CouponAPI/.env
    ports:
      - "5104:8080"
      - "7001:8081"
    networks:
      - mango-network  
    depends_on:
      mango-sql-docker:
        condition: service_healthy
        
  mango-reward:
    image: ${DOCKER_REGISTRY-}mangorewardapi
    container_name: mango-reward
    build:
      context: ./Mango.Services.RewardAPI
      dockerfile: Dockerfile
    env_file:
      - ./Mango.Services.RewardAPI/.env
    ports:
      - "5202:8080"
      - "7009:8081"
    networks:
      - mango-network
    depends_on:
      mango-sql-docker:
        condition: service_healthy
      mango-rabbitmq-docker:
        condition: service_healthy

  mango-order:
    image: ${DOCKER_REGISTRY-}mangoorderapi
    container_name: mango-order
    build:
      context: ./Mango.Services.OrderAPI
      dockerfile: Dockerfile
      secrets:
        - nugetconfig
    env_file:
      - ./Mango.Services.OrderAPI/.env
    ports:
      - "5201:8080"
      - "7004:8081"
    networks:
      - mango-network
    depends_on:
      mango-sql-docker:
        condition: service_healthy
      mango-rabbitmq-docker:
        condition: service_healthy

  mango-email:
    image: ${DOCKER_REGISTRY-}mangoemailapi
    build:
      context: ./Mango.Services.EmailAPI
      dockerfile: Dockerfile
      secrets:
        - nugetconfig
    container_name: mango-email
    env_file:
      - ./Mango.Services.EmailAPI/.env
    ports:
      - "5216:8080"
    networks:
      - mango-network
    depends_on:
      mango-sql-docker:
        condition: service_healthy
      mango-rabbitmq-docker:
        condition: service_healthy

  mango-shoppingcart:
    image: ${DOCKER_REGISTRY-}mangoshoppingcartapi
    build:
      context: ./Mango.Services.ShoppingCartAPI
      dockerfile: Dockerfile
      secrets:
        - nugetconfig
    container_name: mango-shoppingcart
    env_file:
      - ./Mango.Services.ShoppingCartAPI/.env
    ports:
      - "5220:8080"
    networks:
      - mango-network
    depends_on:
      mango-sql-docker:
        condition: service_healthy
      mango-rabbitmq-docker:
        condition: service_healthy
  
  mango-web:
    image: ${DOCKER_REGISTRY-}mangoweb
    build:
      context: ./Mango.Web
      dockerfile: Dockerfile
    container_name: mango-web
    env_file:
      - ./Mango.Web/.env
    ports:
      - "5048:8080"
    networks:
      - mango-network

  mango-sql-docker:
      image: mcr.microsoft.com/mssql/server:2022-latest
      container_name: mango-sql-docker
      env_file:
        - ./.env
      environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the root .env file}"
      ports:
        - "1433:1433"
      volumes:
        - mango-sql-data:/var/opt/mssql
      networks:
        - mango-network
      healthcheck:
        test:
          - CMD
          - /opt/mssql-tools18/bin/sqlcmd
          - -S
          - localhost
          - -U
          - sa
          - -P
          - "${MSSQL_SA_PASSWORD}"
          - -C
          - -Q
          - "SELECT 1"
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s

  mango-rabbitmq-docker:
    image: rabbitmq:4.2-management
    container_name: mango-rabbitmq-docker
    env_file:
      - ./.env
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in the root .env file}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in the root .env file}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - mango-rabbit-data:/var/lib/rabbitmq
    networks:
      - mango-network
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s